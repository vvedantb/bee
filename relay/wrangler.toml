# Bee relay: Cloudflare Worker + one Durable Object (teams, presence, rooms, phrases).
# Deploy from this folder: npx wrangler deploy   (see README.md)
name = "bee-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "BeeRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BeeRelay"]

[vars]
CLERK_ISSUER = "https://clerk.vedantb.com"
# Optional. Defaults to <CLERK_ISSUER>/.well-known/jwks.json.
# CLERK_JWKS_URL = "https://clerk.vedantb.com/.well-known/jwks.json"
# Optional, comma-separated azp allowlist.
# CLERK_AUTHORIZED_PARTIES = "bee://renderer"
