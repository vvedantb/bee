name: CI

on:
  pull_request:
  push:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      # Typecheck runs inside build.
      - run: npm run build
      - name: Package macOS dmg + zip (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bee-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
