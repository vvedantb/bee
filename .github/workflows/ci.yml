name: CI

on:
  pull_request:
  push:

jobs:
  # Fast feedback on Linux: typecheck, test-rule lint and the unit tests. Windows and macOS below also build and package.
  ubuntu:
    runs-on: boat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  # Catches Windows-only test failures (path separators, POSIX mode bits) on PRs, not only in the release run. Also builds the
  # Teams audio helper (native/teams-audio/windows) and checks the unpacked app carries it.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Fails the job if the helper does not compile or does not answer --version (which never opens audio).
      - name: Build Teams audio helper
        run: npm run build:teams-audio:win
      - name: Check Teams audio helper
        shell: pwsh
        run: |
          $helper = "native/teams-audio/dist/win32-x64/teams-audio-helper.exe"
          if (-not (Test-Path $helper)) { throw "Teams audio helper missing: $helper" }
      - name: Check Teams audio helper protocol
        run: node scripts/check-helper-protocol.mjs native/teams-audio/dist/win32-x64/teams-audio-helper.exe
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      - name: Check koffi stays external in built main
        run: node scripts/check-koffi-external.mjs out/main/index.js
      - name: Package Windows (unpacked, unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win dir --x64 --publish never
      - name: Check packaged Teams audio helper
        shell: pwsh
        run: |
          $helper = "release/win-unpacked/resources/teams-audio/teams-audio-helper.exe"
          if (-not (Test-Path $helper)) { throw "Teams audio helper not packaged: $helper" }
          $version = & $helper --version
          if ($LASTEXITCODE -ne 0 -or "$version" -ne "teams-audio-helper protocol=3") { throw "Packaged Teams audio helper --version failed: $version" }
      - name: Check packaged koffi (asarUnpack + win32 binary + AllowSetForegroundWindow bind)
        run: node scripts/check-koffi-windows.mjs release/win-unpacked

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Fails the job if either helper does not compile, is the wrong architecture or does not answer --version.
      - name: Build Teams audio helpers (arm64 + x64)
        run: npm run build:teams-audio:mac
      - name: Check Teams audio helpers
        run: |
          for arch in arm64 x64; do
            test -f "native/teams-audio/dist/darwin-$arch/teams-audio-helper" || { echo "Teams audio helper missing: $arch"; exit 1; }
          done
      # The helper's --protocol output must match src/core/teams-audio-protocol.ts (host architecture only: it has to run).
      - name: Check Teams audio helper protocol
        run: |
          arch="$(uname -m)"; [ "$arch" = "arm64" ] || arch=x64
          node scripts/check-helper-protocol.mjs "native/teams-audio/dist/darwin-$arch/teams-audio-helper"
      - run: npm test
      # Typecheck runs inside build.
      - run: npm run build
      # The live conversation E2E on its recorded model calls (test/fixtures/replay): no key, no network.
      - name: Conversation E2E (replay)
        run: npm run test:replay
      - name: Package macOS dmg + zip (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - name: Check app.asar modules
        run: node scripts/check-asar-modules.mjs release/mac-arm64/Bee.app/Contents/Resources/app.asar
      - name: Check packaged Teams audio helpers
        run: |
          check() {
            helper="$1/Contents/Resources/teams-audio/teams-audio-helper"
            test -f "$helper" || { echo "Teams audio helper not packaged: $helper"; exit 1; }
            arch="$(lipo -archs "$helper")"
            [ "$arch" = "$2" ] || { echo "$helper is $arch, expected $2"; exit 1; }
          }
          check release/mac-arm64/Bee.app arm64
          check release/mac/Bee.app x86_64
          version="$(release/mac-arm64/Bee.app/Contents/Resources/teams-audio/teams-audio-helper --version)"
          [ "$version" = "teams-audio-helper protocol=3" ] || { echo "Packaged Teams audio helper --version failed: $version"; exit 1; }
      - name: Smoke test packaged app
        run: |
          # macOS has no timeout command: kill the app after 30 s.
          ELECTRON_ENABLE_LOGGING=1 BEE_SMOKE_EXIT=1 release/mac-arm64/Bee.app/Contents/MacOS/Bee > smoke.log 2>&1 &
          pid=$!
          ( sleep 30; kill -9 $pid 2>/dev/null ) &
          status=0
          wait $pid || status=$?
          cat smoke.log
          if [ "$status" -ne 0 ]; then echo "Smoke run exited with $status"; exit 1; fi
          if grep -q "Cannot find module" smoke.log; then echo "Missing module"; exit 1; fi
          grep -q BEE_SMOKE_OK smoke.log
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bee-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
