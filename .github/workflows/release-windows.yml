name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.2.1"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Repository variable with the deployed relay URL (relay/README.md). Unset: Teams mode is off.
          MAIN_VITE_BEE_RELAY_URL: ${{ vars.BEE_RELAY_URL }}
      - name: Build Windows installer + zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis zip --x64 --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bee-windows
          path: |
            release/*.exe
            release/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          MAIN_VITE_BEE_RELAY_URL: ${{ vars.BEE_RELAY_URL }}
      - name: Build macOS dmg + zip
        env:
          # Unsigned by default. Set CSC_LINK, CSC_KEY_PASSWORD and the Apple notarisation secrets to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --universal --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bee-macos
          path: |
            release/*.dmg
            release/*.zip

  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then TAG="v$TAG"; fi
          ls dist
          gh release create "$TAG" dist/Bee*.exe dist/Bee*.zip dist/Bee*.dmg \
            --title "Bee $TAG" \
            --notes "Windows installer (NSIS) and portable zip, and macOS dmg and zip (universal: Apple Silicon and Intel). Builds are unsigned. Windows SmartScreen may warn. On macOS, Gatekeeper will warn: right-click Bee and choose Open." \
            --latest || \
          gh release upload "$TAG" dist/Bee*.exe dist/Bee*.zip dist/Bee*.dmg --clobber
