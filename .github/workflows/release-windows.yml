name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.2.1"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The Teams audio helper (native/teams-audio/windows). Fails the release if it does not compile or answer --version.
      - name: Build Teams audio helper
        run: npm run build:teams-audio:win
      - run: npm test
      - run: npm run build
        env:
          # Repository variable with the deployed relay URL (relay/README.md). Unset: Teams mode is off.
          MAIN_VITE_BEE_RELAY_URL: ${{ vars.BEE_RELAY_URL }}
      - name: Build Windows installer + zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis zip --x64 --publish never
      # electron-builder skips a missing extraResources file, so check the helper made it into the app.
      - name: Check packaged Teams audio helper
        shell: pwsh
        run: |
          $helper = "release/win-unpacked/resources/teams-audio/teams-audio-helper.exe"
          if (-not (Test-Path $helper)) { throw "Teams audio helper not packaged: $helper" }
          $version = & $helper --version
          if ($LASTEXITCODE -ne 0 -or "$version" -ne "teams-audio-helper protocol=1") { throw "Packaged Teams audio helper --version failed: $version" }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bee-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The Teams audio helpers (native/teams-audio/macos), arm64 and x64. Fails the release if either does not compile.
      - name: Build Teams audio helpers (arm64 + x64)
        run: npm run build:teams-audio:mac
      - run: npm test
      - run: npm run build
        env:
          MAIN_VITE_BEE_RELAY_URL: ${{ vars.BEE_RELAY_URL }}
      - name: Build macOS dmg + zip
        env:
          # Unsigned by default. Set CSC_LINK, CSC_KEY_PASSWORD and the Apple notarisation secrets to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - name: Check packaged Teams audio helpers
        run: |
          check() {
            helper="$1/Contents/Resources/teams-audio/teams-audio-helper"
            test -f "$helper" || { echo "Teams audio helper not packaged: $helper"; exit 1; }
            arch="$(lipo -archs "$helper")"
            [ "$arch" = "$2" ] || { echo "$helper is $arch, expected $2"; exit 1; }
          }
          check release/mac-arm64/Bee.app arm64
          check release/mac/Bee.app x86_64
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bee-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then TAG="v$TAG"; fi
          ls dist
          gh release create "$TAG" dist/Bee*.exe dist/Bee*.zip dist/Bee*.dmg dist/*.blockmap dist/latest*.yml \
            --title "Bee $TAG" \
            --notes "Windows installer (NSIS) and portable zip, and macOS dmg and zip (separate Apple Silicon arm64 and Intel x64 builds). Builds are unsigned. Windows SmartScreen may warn. On macOS, Gatekeeper will warn: right-click Bee and choose Open." \
            --latest || \
          gh release upload "$TAG" dist/Bee*.exe dist/Bee*.zip dist/Bee*.dmg dist/*.blockmap dist/latest*.yml --clobber
