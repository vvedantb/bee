name: Release

# Three ways in:
# - A merge to main that changes what the app is built from (the paths below) releases the next patch version.
# - A pushed v* tag releases that tag, as before.
# - Manual dispatch releases the given tag, or the next patch version when the tag is left empty. dry_run builds
#   everything and publishes nothing.
on:
  push:
    tags:
      - "v*"
    branches: [main]
    # Only what goes into the app: its source, the native helper, the packaged resources, the dependencies and the
    # build settings. Not in the list: tests, docs, landing, relay, convex and .github, so a merge that changes only
    # those releases nothing. GitHub does not apply this filter to tag pushes.
    paths:
      - "src/**"
      - "!src/**/*.test.ts"
      - "!src/**/*.test.tsx"
      - "native/**"
      - "resources/**"
      - "package.json"
      - "package-lock.json"
      - "electron.vite.config.ts"
      - "tsconfig.json"
      - "scripts/build-teams-audio-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Empty: the next patch version after the highest release."
        required: false
        default: ""
      dry_run:
        description: "Build and check everything, but publish nothing (no tag, no release)."
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time. The version is chosen inside the run, so a queued run sees the release before it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Picks the tag. A tag push or a dispatch with a tag uses that tag and leaves package.json alone, as before.
  # Otherwise: the patch bump of the latest published vX.Y.Z release, and never lower than package.json. The build
  # jobs write that version into package.json in their workspace; nothing is committed to main. One API call reads the
  # latest release only; it does not page through all of them.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      set_version: ${{ steps.pick.outputs.set_version }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GIVEN: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$GIVEN" ]; then
            tag="$GIVEN"
            if [[ "$tag" != v* ]]; then tag="v$tag"; fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "set_version=" >> "$GITHUB_OUTPUT"
            echo "Releasing the given tag $tag"
            exit 0
          fi
          pkg="$(sed -n 's/^  "version": "\([0-9][0-9.]*\)",$/\1/p' package.json | head -n 1)"
          if [ -z "$pkg" ]; then echo "::error::No version found in package.json"; exit 1; fi
          # 404 means no release yet. Any other failure stops the run rather than guessing a version.
          if out="$(gh api "repos/$GH_REPO/releases/latest" -q .tag_name 2>&1)"; then
            tags="$out"
          elif printf '%s' "$out" | grep -q 'HTTP 404'; then
            tags=""
          else
            echo "::error::Could not read the latest release: $out"; exit 1
          fi
          last="$(printf '%s\n' "$tags" | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' | sort -V | tail -n 1)"
          if [ -n "$last" ]; then
            IFS=. read -r major minor patch <<< "$last"
            bumped="$major.$minor.$((patch + 1))"
          else
            bumped="$pkg"
          fi
          version="$(printf '%s\n%s\n' "$pkg" "$bumped" | sort -V | tail -n 1)"
          echo "package.json $pkg, latest release ${last:-none}, releasing v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "set_version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # node_modules is restored whole when package-lock.json has not changed, which skips npm ci. A miss runs npm ci
      # and saves the result, so the next release reads it.
      - name: Restore node_modules
        id: modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save node_modules
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Set the release version
        if: needs.version.outputs.set_version != ''
        shell: bash
        run: npm version "${{ needs.version.outputs.set_version }}" --no-git-tag-version --allow-same-version
      # The Teams audio helper (native/teams-audio/windows) fails the release if it does not compile or answer --version.
      # The helper build, the tests and the Vite bundle do not depend on each other, so they run at once. Each log is
      # printed in its own group after all end, and the step fails if any failed. There is no PR CI, so these are the
      # gates for every release, including merges to main. `npm run build` runs the typecheck.
      - name: Helper build, tests and bundle (parallel)
        shell: bash
        env:
          # Repository variable with the deployed relay URL (relay/README.md). Unset: Teams mode is off.
          MAIN_VITE_BEE_RELAY_URL: ${{ vars.BEE_RELAY_URL }}
        run: |
          dir="$RUNNER_TEMP/parallel"; mkdir -p "$dir"
          cmds=("npm run build:teams-audio:win" "npm run build" "npm test")
          for i in "${!cmds[@]}"; do
            ( s=$SECONDS; rc=0; bash -e -o pipefail -c "${cmds[$i]}" > "$dir/$i.log" 2>&1 || rc=$?; echo "$rc $((SECONDS - s))" > "$dir/$i.res" ) &
          done
          wait
          failed=0
          for i in "${!cmds[@]}"; do
            rc=1; sec=0
            [ -f "$dir/$i.res" ] && read -r rc sec < "$dir/$i.res"
            echo "::group::${cmds[$i]} (${sec}s, exit $rc)"
            cat "$dir/$i.log"
            echo "::endgroup::"
            if [ "$rc" != "0" ]; then echo "::error::Failed: ${cmds[$i]}"; failed=1; fi
          done
          exit $failed
      - name: Build Windows installer + zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis zip --x64 --publish never
      # electron-builder skips a missing extraResources file, so check the helper made it into the app.
      - name: Check packaged Teams audio helper
        shell: pwsh
        run: |
          $helper = "release/win-unpacked/resources/teams-audio/teams-audio-helper.exe"
          if (-not (Test-Path $helper)) { throw "Teams audio helper not packaged: $helper" }
          $version = & $helper --version
          if ($LASTEXITCODE -ne 0 -or "$version" -ne "teams-audio-helper protocol=3") { throw "Packaged Teams audio helper --version failed: $version" }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bee-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: [version, windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A new tag is made at the commit this run built. A tag that already exists is left where it is.
          TAG="${{ needs.version.outputs.tag }}"
          ls dist
          gh release create "$TAG" dist/Bee*.exe dist/Bee*.zip dist/*.blockmap dist/latest*.yml \
            --title "Bee $TAG" \
            --notes "Windows installer (NSIS) and portable zip. The build is unsigned, so Windows SmartScreen may warn." \
            --target "$GITHUB_SHA" --latest || \
          gh release upload "$TAG" dist/Bee*.exe dist/Bee*.zip dist/*.blockmap dist/latest*.yml --clobber
